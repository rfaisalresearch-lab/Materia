name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Materia
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[adapters,bigdata,dev,xray,device,validation]"
          python -m pip install rdkit openmm pdbfixer radioactivedecay particle
      - name: Unit and integration tests
        run: python -m pytest -q -m "not validation and not performance and not slow" tests/unit tests/integration

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release packages
        run: python tools/make_release.py --output dist
      - name: Run the Windows installer
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter '*-windows.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath unpacked
          $folder = Get-ChildItem unpacked | Select-Object -First 1
          $env:MATERIA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'MateriaInstall'
          & (Join-Path $folder.FullName 'install.ps1')
          $python = Join-Path $env:MATERIA_INSTALL_DIR '.venv\Scripts\python.exe'
          & $python -X utf8 -m materia.cli info
          if ($LASTEXITCODE -ne 0) { throw 'materia info failed' }
          $server = Start-Process -FilePath $python -ArgumentList '-X','utf8','-m','materia.cli','serve','--port','8799' -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            try { $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/; if ($page.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep -Seconds 1 }
          }
          Stop-Process -Id $server.Id -Force
          if (-not $ok) { throw 'The installed Materia server did not answer' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Materia.lnk'
          if (-not (Test-Path $shortcut)) { throw 'The Start Menu shortcut was not created' }
